<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Team — سوپر مینی‌اپ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        :root {
            --primary: #a855f7;
            --primary-dark: #7c3aed;
            --primary-light: #c084fc;
            --bg: #0a0a0a;
            --bg-card: #14141e;
            --bg-hover: #1e1e2e;
            --text: #ffffff;
            --text-muted: #8888aa;
            --border: rgba(255,255,255,0.06);
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0,0,0,0.8);
            --transition: 0.3s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }
        .app {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 100;
            height: 64px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-weight: 300;
            -webkit-text-fill-color: var(--text-muted);
        }
        .badge {
            font-size: 10px;
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            -webkit-text-fill-color: #fff;
        }
        .premium-badge {
            font-size: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            display: none;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
        }
        .header-center input {
            width: 100%;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }
        .header-center input:focus {
            border-color: var(--primary);
            background: rgba(168,85,247,0.05);
        }
        .header-center input::placeholder {
            color: var(--text-muted);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
        }
        .sidebar {
            position: fixed;
            top: 64px;
            left: 0;
            width: 56px;
            height: calc(100vh - 64px);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 4px;
            overflow-y: auto;
            z-index: 50;
            transition: width 0.3s ease;
        }
        .sidebar:hover {
            width: 200px;
        }
        .sidebar::-webkit-scrollbar {
            width: 2px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            width: 100%;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            font-size: 13px;
            font-family: inherit;
            justify-content: center;
        }
        .sidebar:hover .sidebar-item {
            justify-content: flex-start;
        }
        .sidebar-item:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .sidebar-item.active {
            background: rgba(168,85,247,0.15);
            color: var(--primary);
        }
        .sidebar-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }
        .sidebar-item .label {
            display: none;
            font-size: 13px;
        }
        .sidebar:hover .sidebar-item .label {
            display: inline;
        }
        .main-content {
            margin-left: 56px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px 24px;
            height: calc(100vh - 64px);
        }
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
            padding: 4px 0;
        }
        .page.active {
            display: flex;
        }
        .page::-webkit-scrollbar {
            width: 4px;
        }
        .page::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
        }
        .page-title small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            margin-right: 12px;
        }
        .page-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(168,85,247,0.3);
        }
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: var(--border);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 16px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            transition: var(--transition);
        }
        .card:hover {
            border-color: rgba(168,85,247,0.2);
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .card-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(168,85,247,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .card-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .list-item .left svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }
        .list-item .title {
            font-size: 14px;
        }
        .list-item .sub {
            font-size: 12px;
            color: var(--text-muted);
        }
        .list-item .right {
            font-size: 13px;
            color: var(--text-muted);
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .msg {
            padding: 12px 18px;
            border-radius: 14px;
            max-width: 75%;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.7;
            animation: fadeUp 0.3s ease;
        }
        .msg.user {
            background: rgba(168,85,247,0.15);
            border: 1px solid rgba(168,85,247,0.2);
            margin-right: auto;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            margin-left: auto;
            border-bottom-left-radius: 4px;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-input {
            display: flex;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            padding-right: 50px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            height: 44px;
        }
        .chat-input input:focus {
            border-color: var(--primary);
        }
        .chat-input input::placeholder {
            color: var(--text-muted);
        }
        .chat-input .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
        }
        .chat-input .send-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 8px 30px rgba(168,85,247,0.3);
        }
        .chat-input .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }
        .message-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            opacity: 0.4;
            transition: var(--transition);
        }
        .message-actions:hover {
            opacity: 1;
        }
        .message-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 2px;
            transition: var(--transition);
        }
        .message-actions button:hover {
            color: var(--text);
            transform: scale(1.1);
        }
        .message-actions button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeUp 0.3s ease;
        }
        .typing {
            display: none;
            padding: 8px 16px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .typing.active {
            display: block;
        }
        .typing span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            margin: 0 2px;
            animation: dot 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                padding: 8px 0;
            }
            .sidebar:hover {
                width: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 12px 16px;
            }
            .grid-2, .grid-3, .grid-4 {
                grid-template-columns: 1fr;
            }
            .header-center {
                display: none;
            }
            .header {
                padding: 8px 16px;
                height: 56px;
            }
            .page-title {
                font-size: 18px;
            }
            .page-title small {
                display: none;
            }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.away { background: #f59e0b; }
        .premium-card {
            border-color: rgba(245,158,11,0.3);
            background: rgba(245,158,11,0.05);
        }
    </style>
</head>
<body>

<div class="app" id="app">

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo">AI <span>Team</span></div>
            <span class="badge">v4.0</span>
            <span class="premium-badge" id="premiumBadge">PREMIUM</span>
        </div>
        <div class="header-center">
            <input type="text" placeholder="Search anything... (Ctrl+K)" id="globalSearch" />
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <button class="icon-btn" onclick="showStatus()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
            </button>
            <div class="avatar" onclick="showProfile()">MK</div>
        </div>
    </header>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <button class="sidebar-item active" data-page="dashboard" onclick="navigate('dashboard')">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            <span class="label">Dashboard</span>
        </button>
        <button class="sidebar-item" data-page="models" onclick="navigate('models')">
            <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span class="label">AI Models</span>
        </button>
        <button class="sidebar-item" data-page="chat" onclick="navigate('chat')">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="label">Chat</span>
        </button>
        <button class="sidebar-item" data-page="agents" onclick="navigate('agents')">
            <svg viewBox="0 0 24 24">
