<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0a0a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            direction: rtl;
        }
        .app {
            width: 100%;
            max-width: 820px;
            height: 100vh;
            max-height: 940px;
            background: #141414;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            background: #141414;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left .logo-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #2a2a2a;
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-left .logo-wrapper svg {
            width: 24px;
            height: 24px;
            fill: #111827;
        }
        .header-left .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .badge {
            font-size: 10px;
            color: #6b7280;
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 9999px;
            border: 1px solid #2a2a2a;
        }
        .icon-btn {
            background: transparent;
            border: 1.5px solid #2a2a2a;
            color: #9ca3af;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            border-color: #3b82f6;
            color: #e5e7eb;
            background: #1a1a1a;
            transform: scale(1.04);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 12px 0 16px;
            flex-shrink: 0;
        }
        .home-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1.5px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 70px;
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }
        .home-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-btn .label {
            font-size: 12px;
            font-weight: 600;
        }
        .home-btn.chat .label {
            color: #ef4444;
        }
        .home-btn.chat svg {
            color: #ef4444;
        }
        .home-btn.image .label {
            color: #3b82f6;
        }
        .home-btn.image svg {
            color: #3b82f6;
        }
        .home-btn.video .label {
            color: #22c55e;
        }
        .home-btn.video svg {
            color: #22c55e;
        }
        .home-btn.pdf .label {
            color: #eab308;
        }
        .home-btn.pdf svg {
            color: #eab308;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 4px 2px 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-wrapper .msg {
            padding: 10px 16px;
            border-radius: 12px;
            max-width: 88%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.8;
            border: 1px solid transparent;
        }
        .msg-wrapper.user .msg {
            background: #3b82f6;
            color: #fff;
            margin-right: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }
        .msg-wrapper.bot .msg {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #e5e7eb;
            margin-left: auto;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }
        .msg-wrapper.bot .msg.typing {
            color: #6b7280;
            border-color: transparent;
            background: transparent;
            backdrop-filter: none;
        }
        .msg-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
            margin-right: 4px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .msg-wrapper:hover .msg-actions,
        .msg-actions:focus-within {
            opacity: 1;
        }
        .msg-actions button {
            background: transparent;
            border: 1.5px solid #2a2a2a;
            color: #9ca3af;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
        .msg-actions button:hover {
            border-color: #3b82f6;
            color: #e5e7eb;
            background: #1a1a1a;
        }
        .msg-actions button.active-like {
            border-color: #22c55e;
            color: #22c55e;
        }
        .msg-actions button.active-dislike {
            border-color: #ef4444;
            color: #ef4444;
        }
        .msg-actions button .count {
            font-size: 9px;
            opacity: 0.6;
        }
        .msg-actions button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .code-block {
            background: #0d0d0d;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 8px 0 4px;
            border: 1px solid #2a2a2a;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            position: relative;
        }
        .code-block pre {
            color: #e5e7eb;
            font-family: "Courier New", monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            line-height: 1.7;
        }
        .code-block .copy-code-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .code-block .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #e5e7eb;
        }
        .code-block .copy-code-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .composer {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid #2a2a2a;
            flex-shrink: 0;
            background: #0a0a0a;
        }
        .composer input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1.5px solid #2a2a2a;
            font-size: 14px;
            outline: none;
            font-family: system-ui, sans-serif;
            background: #0d0d0d;
            color: #e5e7eb;
            transition: border 0.2s, background 0.3s;
            min-height: 44px;
        }
        .composer input::placeholder {
            color: #6b7280;
        }
        .composer input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .composer input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .composer .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .composer .send-btn:hover {
            transform: scale(1.04);
            background: #2563eb;
        }
        .composer .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .composer .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .composer .stop-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid #ef4444;
            background: transparent;
            color: #ef4444;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .composer .stop-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        .composer .stop-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .composer .action-btn {
            background: transparent;
            border: 1.5px solid #2a2a2a;
            color: #9ca3af;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
        }
        .composer .action-btn:hover {
            border-color: #3b82f6;
            color: #e5e7eb;
            background: #1a1a1a;
        }
        .composer .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .status {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            padding: 4px 0 0;
            flex-shrink: 0;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            padding: 8px 0 0;
            border-top: 1px solid #2a2a2a;
            flex-shrink: 0;
            background: #0a0a0a;
        }
        .footer span {
            color: #3b82f6;
            font-weight: 500;
        }
        .action-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 4px 0 2px;
            padding: 4px 0;
        }
        .action-bar button {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #9ca3af;
            padding: 4px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: system-ui, sans-serif;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .action-bar button:hover {
            background: #1a1a1a;
            border-color: #3b82f6;
            color: #e5e7eb;
        }
        .action-bar button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chat-counter {
            font-size: 11px;
            color: #6b7280;
        }
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .toast {
            background: #141414;
            color: #e5e7eb;
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            pointer-events: auto;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success {
            border-color: #22c55e;
            color: #22c55e;
        }
        .toast.error {
            border-color: #ef4444;
            color: #ef4444;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 700px) {
            body {
                padding: 6px;
            }
            .app {
                border-radius: 12px;
                max-height: 100vh;
                max-width: 100%;
            }
            .msg-wrapper .msg {
                max-width: 94%;
                font-size: 13px;
                padding: 8px 12px;
            }
            .home-actions {
                gap: 10px;
            }
            .home-btn {
                padding: 8px 12px;
                min-width: 60px;
            }
            .home-btn svg {
                width: 22px;
                height: 22px;
            }
            .home-btn .label {
                font-size: 11px;
            }
            .composer input {
                font-size: 13px;
                padding: 8px 12px;
                min-height: 38px;
            }
            .composer .send-btn,
            .composer .stop-btn,
            .composer .action-btn {
                min-height: 38px;
                min-width: 38px;
                width: 38px;
                height: 38px;
            }
            .icon-btn {
                width: 34px;
                height: 34px;
            }
            .icon-btn svg {
                width: 16px;
                height: 16px;
            }
            .header-left .logo-wrapper {
                width: 30px;
                height: 30px;
            }
            .header-left .logo-wrapper svg {
                width: 20px;
                height: 20px;
            }
        }
        @media (max-width: 450px) {
            .header-left .badge {
                display: none;
            }
            .home-actions {
                gap: 6px;
            }
            .home-btn {
                padding: 6px 10px;
                min-width: 50px;
            }
            .home-btn svg {
                width: 18px;
                height: 18px;
            }
            .home-btn .label {
                font-size: 10px;
            }
            .msg-actions button {
                font-size: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo-wrapper">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        <circle cx="9" cy="10" r="1.5"/>
                        <circle cx="15" cy="10" r="1.5"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    </svg>
                </div>
                <span class="logo-text">MiniGPT</span>
                <span class="badge">v3.0</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </header>

        <main style="flex:1;display:flex;flex-direction:column;padding:12px 16px 8px;overflow:hidden;background:#0a0a0a;">
            <div class="home-actions">
                <button class="home-btn chat" onclick="switchMode('chat')">
                    <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4
