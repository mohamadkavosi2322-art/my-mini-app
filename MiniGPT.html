<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .app {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #141414;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            margin-bottom: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left .logo-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #2a2a2a;
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-left .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .header-actions .menu-btn {
            background: transparent;
            border: 1.5px solid #2a2a2a;
            color: #9ca3af;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-actions .menu-btn:hover {
            border-color: #3b82f6;
            color: #e5e7eb;
            background: #1a1a1a;
        }
        .header-actions .menu-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 45px;
            left: 0;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 8px;
            min-width: 180px;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
        .dropdown-menu.open {
            display: block;
        }
        .dropdown-menu .model-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #9ca3af;
            font-size: 13px;
        }
        .dropdown-menu .model-item:hover {
            background: #1a1a1a;
            color: #e5e7eb;
        }
        .dropdown-menu .model-item.active {
            background: #3b82f6;
            color: #fff;
        }
        .dropdown-menu .model-item img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #2a2a2a;
        }
        .main {
            background: #141414;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            padding: 20px;
            margin-bottom: 16px;
        }
        .chat-box {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            min-height: 350px;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
        .msg {
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.8;
        }
        .msg.user {
            background: #3b82f6;
            color: #fff;
            margin-right: auto;
            text-align: right;
        }
        .msg.bot {
            background: #1f1f1f;
            color: #e5e7eb;
            margin-left: auto;
            text-align: left;
            border: 1px solid #2a2a2a;
        }
        .msg.bot.typing {
            color: #6b7280;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            background: #1a1a1a;
            color: #e5e7eb;
            transition: border 0.2s;
        }
        .input-area input::placeholder {
            color: #6b7280;
        }
        .input-area input:focus {
            border-color: #3b82f6;
        }
        .input-area button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            font-family: inherit;
        }
        .input-area button:hover {
            background: #2563eb;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            justify-content: center;
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        .actions button {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #9ca3af;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .actions button:hover {
            background: #1f1f1f;
            border-color: #3b82f6;
            color: #e5e7eb;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #4b5563;
            padding-top: 16px;
            border-top: 1px solid #2a2a2a;
        }
        .footer span {
            color: #3b82f6;
        }
        .status {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            margin-top: 10px;
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 12px 16px;
            }
            .main {
                padding: 16px;
            }
            .chat-box {
                min-height: 280px;
                max-height: 350px;
            }
            .dropdown-menu {
                left: -10px;
                min-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- هدر -->
        <div class="header">
            <div class="header-left">
                <div class="logo-wrapper">
                    <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" 
                         alt="MiniGPT Logo" />
                </div>
                <h1>ChatGPT</h1>
            </div>
            <div class="header-actions">
                <button class="menu-btn" id="menuBtn" aria-label="Menu">
                    <svg viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="model-item active" data-model="gpt-4o-mini">
                        <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" alt="GPT-4o Mini" />
                        GPT-4o Mini
                    </div>
                    <div class="model-item" data-model="gpt-4o">
                        <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" alt="GPT-4o" />
                        GPT-4o
                    </div>
                    <div class="model-item" data-model="gpt-4">
                        <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" alt="GPT-4" />
                        GPT-4
                    </div>
                    <div class="model-item" data-model="gpt-3.5-turbo">
                        <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" alt="GPT-3.5" />
                        GPT-3.5
                    </div>
                    <div class="model-item" data-model="o1-mini">
                        <img src="https://raw.githubusercontent.com/mohamadkavosi2322-art/my-mini-app/main/file_000000009dc481f4beac7bb7a39278af.png" alt="O1 Mini" />
                        O1 Mini
                    </div>
                </div>
            </div>
        </div>

        <!-- بخش اصلی -->
        <div class="main">
            <!-- چت باکس -->
            <div class="chat-box" id="chatBox">
                <div class="msg bot">سلام. سوال خود را بپرسید.</div>
            </div>

            <!-- ورودی -->
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key=='Enter') sendMessage()" />
                <button id="sendBtn" onclick="sendMessage()">ارسال</button>
            </div>

            <!-- دکمه‌های عملیات -->
            <div class="actions">
                <button onclick="copyLastResponse()">کپی پاسخ</button>
                <button onclick="clearChat()">پاک کردن چت</button>
                <button onclick="exportChat()">خروجی چت</button>
            </div>

            <div class="status" id="statusText">وضعیت: آماده</div>
        </div>

        <!-- فوتر -->
        <div class="footer">ساخته شده با <span>Bale OpenAI</span></div>
    </div>

    <script>
        const AVALAI_KEY = "aa-7Z6scGydDdrtJA67WKgoj8cX1ztH9rgeULRwEUB1L7sZeKId";
        const AVALAI_URL = "https://api.avalai.ir/v1/chat/completions";

        let currentModel = "gpt-4o-mini";
        let isWaiting = false;
        let lastBotResponse = '';
        let chatHistory = [];

        // ===== منوی مدل =====
        const menuBtn = document.getElementById('menuBtn');
        const dropdown = document.getElementById('dropdownMenu');

        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });

        document.addEventListener('click', function() {
            dropdown.classList.remove('open');
        });

        document.querySelectorAll('.dropdown-menu .model-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.dropdown-menu .model-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                currentModel = this.dataset.model;
                updateStatus('مدل: ' + this.textContent.trim());
                dropdown.classList.remove('open');
            });
        });

        // ===== چت =====
        function updateStatus(text) {
            document.getElementById('statusText').textContent = 'وضعیت: ' + text;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg || isWaiting) return;

            const box = document.getElementById('chatBox');

            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.textContent = msg;
            box.appendChild(userMsg);
            box.scrollTop = box.scrollHeight;

            chatHistory.push({ role: 'user', content: msg });

            input.value = '';
            isWaiting = true;
            document.getElementById('sendBtn').disabled = true;
            updateStatus('در حال فکر کردن...');

            const botMsg = document.createElement('div');
            botMsg.className = 'msg bot typing';
            botMsg.textContent = 'در حال نوشتن...';
            box.appendChild(botMsg);
            box.scrollTop = box.scrollHeight;

            try {
                const response = await fetch(AVALAI_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + AVALAI_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    botMsg.className = 'msg bot';
                    botMsg.textContent = reply;
                    lastBotResponse = reply;
                    chatHistory.push({ role: 'assistant', content: reply });
                    updateStatus('پاسخ دریافت شد');
                } else {
                    botMsg.className = 'msg bot';
                    botMsg.textContent = 'خطا در دریافت پاسخ';
                    updateStatus('خطا');
                }
            } catch (e) {
                botMsg.className = 'msg bot';
                botMsg.textContent = 'خطا در ارتباط با سرور';
                updateStatus('خطا');
            }

            isWaiting = false;
            document.getElementById('sendBtn').disabled = false;
            box.scrollTop = box.scrollHeight;
        }

        function copyLastResponse() {
            if (lastBotResponse) {
                navigator.clipboard.writeText(lastBotResponse).then(() => {
                    updateStatus('پاسخ کپی شد');
                    setTimeout(() => updateStatus('آماده'), 1500);
                }).catch(() => {
                    updateStatus('خطا در کپی');
                });
            } else {
                updateStatus('پاسخی برای کپی وجود ندارد');
                setTimeout(() => updateStatus('آماده'), 1500);
            }
        }

        function clearChat() {
            const box = document.getElementById('chatBox');
            box.innerHTML = '<div class="msg bot">گفتگو پاک شد. سوال جدیدی دارید؟</div>';
            chatHistory = [];
            lastBotResponse = '';
            updateStatus('گفتگو پاک شد');
            setTimeout(() => updateStatus('آماده'), 1500);
        }

        function exportChat() {
            const box = document.getElementById('chatBox');
            const messages = box.querySelectorAll('.msg');
            let text = 'گفتگوی هوش مصنوعی\n' + '='.repeat(30) + '\n\n';
            messages.forEach(msg => {
                const role = msg.classList.contains('user') ? 'شما' : 'هوش مصنوعی';
                text += role + ': ' + msg.textContent + '\n\n';
            });
            text += '='.repeat(30) + '\nتاریخ: ' + new Date().toLocaleString('fa-IR');

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'گفتگو_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            URL.revokeObjectURL(url);
            updateStatus('خروجی گرفته شد');
            setTimeout(() => updateStatus('آماده'), 1500);
        }
    </script>
</body>
</html>
