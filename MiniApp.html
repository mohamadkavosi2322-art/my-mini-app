<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniGPT — AI Workspace</title>
    <style>
        /* ============================================================
           1. RESET & CSS VARIABLES
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --neutral-50: #f8fafc;
            --neutral-100: #f1f5f9;
            --neutral-200: #e2e8f0;
            --neutral-300: #cbd5e1;
            --neutral-400: #94a3b8;
            --neutral-500: #64748b;
            --neutral-600: #475569;
            --neutral-700: #334155;
            --neutral-800: #1e293b;
            --neutral-900: #0f172a;
            --neutral-950: #020617;
            --success-500: #22c55e;
            --error-500: #ef4444;
            --bg-primary: var(--neutral-50);
            --bg-secondary: #ffffff;
            --bg-surface: var(--neutral-100);
            --bg-input: #ffffff;
            --text-primary: var(--neutral-900);
            --text-secondary: var(--neutral-700);
            --text-muted: var(--neutral-500);
            --border-primary: var(--neutral-200);
            --border-focus: var(--primary-500);
            --accent-primary: var(--primary-500);
            --accent-hover: var(--primary-600);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.10);
            --sp-1: 4px;
            --sp-2: 8px;
            --sp-3: 12px;
            --sp-4: 16px;
            --sp-5: 20px;
            --sp-6: 24px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            --font-mono: "JetBrains Mono", "Fira Code", monospace;
            --header-height: 56px;
            --max-width: 900px;
        }

        [data-theme="dark"] {
            --bg-primary: var(--neutral-950);
            --bg-secondary: var(--neutral-900);
            --bg-surface: var(--neutral-800);
            --bg-input: var(--neutral-800);
            --text-primary: var(--neutral-50);
            --text-secondary: var(--neutral-300);
            --text-muted: var(--neutral-500);
            --border-primary: var(--neutral-700);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.6);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        @media(prefers-color-scheme:dark) {
            [data-theme="system"] {
                --bg-primary: var(--neutral-950);
                --bg-secondary: var(--neutral-900);
                --bg-surface: var(--neutral-800);
                --bg-input: var(--neutral-800);
                --text-primary: var(--neutral-50);
                --text-secondary: var(--neutral-300);
                --text-muted: var(--neutral-500);
                --border-primary: var(--neutral-700);
                --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.6);
                --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.7);
            }
        }

        html {
            font-family: var(--font-sans);
            font-size: 16px;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--sp-3);
            transition: background var(--transition-slow), color var(--transition-slow);
            margin: 0;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: var(--radius-full);
        }

        .app {
            width: 100%;
            max-width: var(--max-width);
            height: 100vh;
            max-height: 960px;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: background var(--transition-slow), border-color var(--transition-slow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--sp-4);
            min-height: var(--header-height);
            border-bottom: 1px solid var(--border-primary);
            flex-shrink: 0;
            background: var(--bg-secondary);
            transition: background var(--transition-slow), border-color var(--transition-slow);
            gap: var(--sp-2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
        }

        .header-left .logo {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .header-left .badge {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-surface);
            padding: 2px var(--sp-2);
            border-radius: var(--radius-full);
            border: 1px solid var(--border-primary);
            -webkit-text-fill-color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
        }

        .icon-btn {
            background: transparent;
            border: 1.5px solid var(--border-primary);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            position: relative;
        }

        .icon-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: var(--bg-surface);
            transform: scale(1.04);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity var(--transition-slow);
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -340px;
            width: 320px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-primary);
            z-index: 1000;
            padding: var(--sp-5) var(--sp-4);
            overflow-y: auto;
            transition: right var(--transition-slow);
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            gap: var(--sp-1);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--sp-3);
            border-bottom: 1px solid var(--border-primary);
            margin-bottom: var(--sp-3);
        }

        .sidebar-header .logo {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: var(--sp-1);
            transition: color var(--transition);
            line-height: 1;
        }

        .sidebar .close-btn:hover {
            color: var(--text-primary);
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            font-family: var(--font-sans);
            font-size: 14px;
            text-align: right;
        }

        .sidebar .nav-item:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        .sidebar .nav-item.active {
            background: var(--accent-primary);
            color: #fff;
        }

        .sidebar .nav-item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .sidebar .nav-divider {
            height: 1px;
            background: var(--border-primary);
            margin: var(--sp-2) 0;
        }

        .sidebar .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            transition: all var(--transition);
            border: 1px solid transparent;
        }

        .sidebar .history-item:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--border-primary);
        }

        .sidebar .history-item.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        .sidebar .history-item .del-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 var(--sp-1);
            transition: color var(--transition);
        }

        .sidebar .history-item .del-btn:hover {
            color: var(--error-500);
        }

        .sidebar .theme-toggle {
            display: flex;
            gap: var(--sp-2);
            margin-top: auto;
            padding-top: var(--sp-4);
            border-top: 1px solid var(--border-primary);
        }

        .sidebar .theme-toggle button {
            padding: var(--sp-1) var(--sp-3);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-primary);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            font-size: 12px;
            flex: 1;
        }

        .sidebar .theme-toggle button.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        .sidebar .theme-toggle button:hover {
            border-color: var(--accent-primary);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--sp-3) var(--sp-4) var(--sp-2);
            overflow: hidden;
            background: var(--bg-primary);
            transition: background var(--transition-slow);
        }

        .model-selector {
            display: flex;
            gap: var(--sp-1);
            flex-wrap: wrap;
            margin-bottom: var(--sp-3);
            flex-shrink: 0;
            padding-bottom: var(--sp-2);
            border-bottom: 1px solid var(--border-primary);
        }

        .model-selector button {
            background: transparent;
            border: 1px solid var(--border-primary);
            color: var(--text-muted);
            padding: var(--sp-1) var(--sp-3);
            border-radius: var(--radius-full);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            font-weight: 500;
        }

        .model-selector button:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .model-selector button.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: var(--sp-1) var(--sp-1) var(--sp-2);
            margin-bottom: var(--sp-2);
            display: flex;
            flex-direction: column;
            gap: var(--sp-1);
            scroll-behavior: smooth;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-wrapper .msg {
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--radius-lg);
            max-width: 88%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.7;
            border: 1px solid transparent;
            transition: all var(--transition);
            position: relative;
        }

        .msg-wrapper.user .msg {
            background: var(--accent-primary);
            color: #fff;
            margin-right: auto;
            text-align: right;
            border-bottom-right-radius: var(--radius-sm);
        }

        .msg-wrapper.bot .msg {
            background: var(--bg-surface);
            color: var(--text-primary);
            margin-left: auto;
            text-align: left;
            border: 1px solid var(--border-primary);
            border-bottom-left-radius: var(--radius-sm);
        }

        .msg-wrapper.bot .msg.typing {
            color: var(--text-muted);
            border-color: transparent;
            background: transparent;
        }

        .msg-actions {
            display: flex;
            gap: var(--sp-1);
            flex-wrap: wrap;
            margin-top: var(--sp-1);
            margin-right: var(--sp-1);
            opacity: 0.25;
            transition: opacity var(--transition);
        }

        .msg-wrapper:hover .msg-actions,
        .msg-actions:focus-within {
            opacity: 1;
        }

        .msg-actions button {
            background: transparent;
            border: 1.5px solid var(--border-primary);
            color: var(--text-muted);
            padding: 2px var(--sp-2);
            border-radius: var(--radius-full);
            font-size: 11px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: var(--sp-1);
            font-weight: 500;
        }

        .msg-actions button:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: var(--bg-surface);
        }

        .msg-actions button.active-like {
            border-color: var(--success-500);
            color: var(--success-500);
        }

        .msg-actions button.active-dislike {
            border-color: var(--error-500);
            color: var(--error-500);
        }

        .msg-actions button .count {
            font-size: 9px;
            opacity: 0.6;
        }

        .msg-actions button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--neutral-950);
            border-radius: var(--radius-md);
            padding: var(--sp-3) var(--sp-4);
            margin: var(--sp-2) 0 var(--sp-1);
            border: 1px solid var(--border-primary);
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            position: relative;
        }

        .code-block pre {
            color: #e5e7eb;
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            line-height: 1.6;
        }

        .code-block .copy-code-btn {
            position: absolute;
            top: var(--sp-1);
            left: var(--sp-1);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--neutral-400);
            padding: var(--sp-1) var(--sp-2);
            border-radius: var(--radius-sm);
            font-size: 11px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: var(--sp-1);
        }

        .code-block .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #e5e7eb;
        }

        .code-block .copy-code-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .composer {
            display: flex;
            gap: var(--sp-2);
            align-items: center;
            padding: var(--sp-2) 0;
            border-top: 1px solid var(--border-primary);
            flex-shrink: 0;
            background: var(--bg-primary);
            transition: background var(--transition-slow), border-color var(--transition-slow);
        }

        .composer input {
            flex: 1;
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--radius-lg);
            border: 1.5px solid var(--border-primary);
            font-size: 14px;
            outline: none;
            font-family: var(--font-sans);
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border var(--transition), background var(--transition-slow);
