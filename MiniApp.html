<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AI Pro</title>
    <style>
        /* ========================================
           RESET & BASE
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-surface: #1a1a1a;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #2a2a2a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --radius: 12px;
            --transition: 0.2s ease;
            --font: system-ui, -apple-system, sans-serif;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        body.light {
            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --bg-surface: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            transition: background var(--transition), color var(--transition);
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        /* ========================================
           SCROLLBAR
        ======================================== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* ========================================
           APP SHELL
        ======================================== */
        .app {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 900px;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            transition: background var(--transition), border-color var(--transition);
        }
        /* ========================================
           HEADER
        ======================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-secondary);
            transition: background var(--transition), border-color var(--transition);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .header-left .badge {
            font-size: 10px;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 18px;
            line-height: 1;
        }
        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--bg-surface);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ========================================
           SIDEBAR (Drawer)
        ======================================== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            transition: right var(--transition);
            box-shadow: var(--shadow);
        }
        .sidebar.open {
            right: 0;
        }
        .sidebar .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            float: left;
            font-family: var(--font);
            line-height: 1;
        }
        .sidebar h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 16px 0 8px;
            font-weight: 500;
        }
        .sidebar .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar .history-item:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }
        .sidebar .history-item.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .sidebar .theme-toggle {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .sidebar .theme-toggle button {
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            font-size: 12px;
        }
        .sidebar .theme-toggle button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .sidebar .theme-toggle button:hover {
            border-color: var(--accent);
        }

        /* ========================================
           MAIN CONTENT
        ======================================== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 20px;
            overflow: hidden;
            background: var(--bg-primary);
            transition: background var(--transition);
        }
        /* ========================================
           MODEL SELECTOR
        ======================================== */
        .model-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .model-selector button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .model-selector button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .model-selector button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ========================================
           CHAT BOX
        ======================================== */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .msg-wrapper .msg {
            padding: 10px 16px;
            border-radius: var(--radius);
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.8;
            border: 1px solid transparent;
            transition: all var(--transition);
        }
        .msg-wrapper.user .msg {
            background: var(--accent);
            color: #fff;
            margin-right: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }
        .msg-wrapper.bot .msg {
            background: var(--bg-surface);
            color: var(--text-primary);
            margin-left: auto;
            text-align: left;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }
        .msg-wrapper.bot .msg.typing {
            color: var(--text-secondary);
            border-color: transparent;
        }
        /* Message Actions (توخالی) */
        .msg-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 2px;
            margin-right: 4px;
            opacity: 0.4;
            transition: opacity var(--transition);
        }
        .msg-wrapper:hover .msg-actions {
            opacity: 1;
        }
        .msg-actions button {
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--text-secondary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .msg-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .msg-actions button.active-like {
            border-color: #22c55e;
            color: #22c55e;
        }
        .msg-actions button.active-dislike {
            border-color: #ef4444;
            color: #ef4444;
        }
        .msg-actions button .count {
            font-size: 9px;
            opacity: 0.6;
        }

        /* ========================================
           CODE BLOCK
        ======================================== */
        .code-block {
            background: #0d0d0d;
            border-radius: 10px;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid var(--border-color);
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            position: relative;
        }
        .code-block pre {
            color: #e5e7eb;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        .code-block .copy-code-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .code-block .copy-code-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #e5e7eb;
        }

        /* ========================================
           COMPOSER
        ======================================== */
        .composer {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-primary);
            transition: background var(--transition), border-color var(--transition);
        }
        .composer input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            background: var(--bg-surface);
            color: var(--text-primary);
            transition: border var(--transition), background var(--transition);
        }
        .composer input::placeholder {
            color: var(--text-secondary);
        }
        .composer input:focus {
            border-color: var(--accent);
        }
        .composer .send-btn {
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: background var(--transition);
            font-family: var(--font);
            flex-shrink: 0;
        }
        .composer .send-btn:hover {
            background: var(--accent-hover);
        }
        .composer .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .composer .stop-btn {
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid #ef4444;
            background: transparent;
            color: #ef4444;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
            font-family: var(--font);
            flex-shrink: 0;
        }
        .composer .stop-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        .composer .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 10px;
            border-radius: var(--radius);
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .composer .action-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .composer .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ========================================
           STATUS / FOOTER
        ======================================== */
        .status {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px 0 0;
            flex-shrink: 0;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            padding: 8px 0 0;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-primary);
            transition: background var(--transition), border-color var(--transition);
        }
        .footer span {
            color: var(--accent);
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .app { border-radius: 16px; max-height: 100vh; }
            .main { padding: 12px 14px; }
            .header { padding: 10px 14px; }
            .sidebar { width: 280px; right: -280px; }
            .msg-wrapper .msg { max-width: 95%; font-size: 13px; }
            .model-selector button { font-size: 11px; padding: 3px 10px; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <button class="icon-btn" id="menuBtn" aria-label="منو">
                <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1>Mini AI Pro</h1>
            <span class="badge">v3.0</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="themeBtn" aria-label="تغییر تم">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </div>
    </header>

    <!-- ===== SIDEBAR (Drawer) ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar" aria-label="بستن منو">✕</button>
        <h3>تاریخچه</h3>
        <div id="historyList"></div>
        <div class="theme-toggle">
            <button class="active" id="themeDark" onclick="setTheme('dark')">تاریک</button>
            <button id="themeLight" onclick="setTheme('light')">روشن</button>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main">
        <!-- Model Selector -->
        <div class="model-selector" id="modelContainer">
            <button class="active" data-model="gpt-4o-mini">GPT-4o Mini</button>
            <button data-model="gpt-4o">GPT-4o</button>
            <button data-model="gpt-4">GPT-4</button>
            <button data-model="gpt-3.5-turbo">GPT-3.5</button>
            <button data-model="o1-mini">O1 Mini</button>
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="msg-wrapper bot">
                <div class="msg bot">سلام. چطور می‌تونم کمکت کنم؟</div>
            </div>
        </div>

        <!-- Composer -->
        <div class="composer">
            <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key=='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }">

                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
