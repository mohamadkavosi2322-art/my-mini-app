<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniGPT — AI Workspace</title>
    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-surface: #1a1a1a;
            --bg-input: #0d0d0d;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-primary: #2a2a2a;
            --border-light: #3a3a3a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --max-width: 820px;
            --header-height: 56px;
        }

        body.light {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-surface: #f8fafc;
            --bg-input: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-primary: #e2e8f0;
            --border-light: #d1d5db;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            transition: background 0.3s, color 0.3s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ===== APP SHELL ===== */
        .app {
            width: 100%;
            max-width: var(--max-width);
            height: 100%;
            max-height: 940px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            min-height: var(--header-height);
            border-bottom: 1px solid var(--border-primary);
            flex-shrink: 0;
            background: var(--bg-secondary);
            transition: background 0.3s, border-color 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .logo-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid var(--border-primary);
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-left .logo-wrapper svg {
            width: 24px;
            height: 24px;
            fill: #111827;
        }

        .header-left .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left .badge {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-surface);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-primary);
            -webkit-text-fill-color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: 1.5px solid var(--border-primary);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--bg-surface);
            transform: scale(1.04);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== SIDEBAR ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -340px;
            width: 320px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-primary);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-primary);
            margin-bottom: 12px;
        }

        .sidebar-header .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
            line-height: 1;
        }

        .sidebar .close-btn:hover {
            color: var(--text-primary);
        }

        .sidebar .section-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin: 12px 0 6px;
            padding: 0 4px;
        }

        .sidebar .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .sidebar .history-item:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--border-primary);
        }

        .sidebar .history-item.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .sidebar .history-item .del-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .sidebar .history-item .del-btn:hover {
            color: var(--danger);
        }

        .sidebar .search-input {
            width: 100%;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-primary);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            font-family: var(--font);
            transition: border 0.2s;
        }

        .sidebar .search-input:focus {
            border-color: var(--accent);
        }

        .sidebar .search-input::placeholder {
            color: var(--text-muted);
        }

        .sidebar .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
        }

        .sidebar .color-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-primary);
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
        }

        .sidebar .color-item:hover {
            border-color: var(--accent);
        }

        .sidebar .color-item.active {
            border-color: var(--accent);
            background: var(--bg-surface);
        }

        .sidebar .color-circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid var(--border-primary);
            flex-shrink: 0;
        }

        .sidebar .color-name {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .sidebar .model-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .sidebar .model-item:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--border-primary);
        }

        .sidebar .model-item.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .sidebar .model-item svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .sidebar .theme-toggle {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .sidebar .theme-toggle button {
            padding: 4px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-primary);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
            font-size: 12px;
            flex: 1;
        }

        .sidebar .theme-toggle button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .sidebar .theme-toggle button:hover {
            border-color: var(--accent);
        }

        .sidebar .sidebar-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-primary);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 8px;
            overflow: hidden;
            background: var(--bg-primary);
            transition: background 0.3s;
        }

        /* ===== HOME ACTIONS ===== */
        .home-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 12px 0 16px;
            flex-shrink: 0;
        }

        .home-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1.5px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 70px;
            font-family: var(--font);
            background: var(--bg-surface);
        }

        .home-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .home-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .home-btn .label {
            font-size: 12px;
            font-weight: 600;
        }

        .home-btn.chat .label {
            color: #ef4444;
        }
        .home-btn.chat svg {
            color: #ef4444;
        }

        .home-btn.image .label {
            color: #3b82f6;
        }
        .home-btn.image svg {
            color: #3b82f6;
        }

        .home-btn.video .label {
            color: #22c55e;
        }
        .home-btn.video svg {
            color: #22c55e;
        }

        .home-btn.pdf .label {
            color: #eab308;
        }
        .home-btn.pdf svg {
            color: #eab308;
        }

        /* ===== CHAT BOX ===== */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 4px 2px 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-wrapper .msg {
            padding: 10px 16px;
            border-radius: var(--radius);
            max-width: 88%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.8;
            border: 1px solid transparent;
            transition: all 0.2s;
            position: relative;
        }

        .msg-wrapper.user .msg {
            background: var(--accent);
            color: #fff;
            margin-right: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }

        .msg-wrapper.bot .msg {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-primary);
            margin-left: auto;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        body.light .msg-wrapper.bot .msg {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.08);
        }

        .msg-wrapper.bot .msg.typing {
            color: var(--text-muted);
            border-color: transparent;
            background: transparent;
            backdrop-filter: none;
        }

        /* ===== MESSAGE ACTIONS (SVG ONLY) ===== */
        .msg-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
            margin-right: 4px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .msg-wrapper:hover .msg-actions,
        .msg-actions:focus-within {
            opacity: 1;
        }

        .msg-actions button {
            background: transparent;
            border: 1.5px solid var(--border-primary);
            color: var(--text-secondary);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .msg-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--bg-surface);
        }

        .msg-actions button.active-like {
            border-color: var(--success);
            color: var(--success);
        }

        .msg-actions button.active-dislike {
            border-color: var(--danger);
            color: var(--danger);
        }

        .msg-actions button .count {
            font-size: 9px;
            opacity: 0.6;
        }

        .msg-actions button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ===== CODE BLOCK ===== */
        .code-block {
            background: #0d0d0d;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 8px 0 4px;
            border: 1px solid var(--border-primary);
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            position: relative;
        }

        body.light .code-block {
            background: #1a1a1a;
        }

        .code-block pre {
            color: #e5e7eb;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
            line-height: 1.7;
        }

        .code-block .copy-code-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .code-block .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #e5e7eb;
        }

        .code-block .copy-code-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap:
